<!-- data-login-mode is set by auth.js after asking the server which flow
     applies (root password, standalone org password, or HRMS-only). Starts as `loading` so
     the wrong form doesn't briefly paint before detection finishes. -->
<section class="login" id="login" data-login-mode="loading">
  <div class="login-card">
    <!-- Banner shown when a magic-link click was rejected. auth.js reads
         ?login_error=... and fills the message. -->
    <div class="login-banner" data-login-banner hidden role="alert">
      <strong data-banner-title>Access denied</strong>
      <span data-banner-message></span>
    </div>

    <!-- Animated welcome — cycles through short greetings. auth.js may still
         populate data-login-sub for mode-specific copy; kept optional. -->
    <div class="login-head login-head-welcome">
      <h2 class="login-welcome" aria-label="Welcome">
        <span class="login-welcome-word" data-welcome>Welcome</span>
      </h2>
      <p class="login-sub" data-login-sub hidden></p>
    </div>

    <form class="login-form" id="login-form" novalidate>
      <label class="login-field">
        <span data-identifier-label>Employee code or email</span>
        <input
          type="text"
          name="email"
          required
          autocomplete="email"
          autocapitalize="off"
          spellcheck="false"
          data-email
        />
      </label>

      <!-- Organization field — visible on root domain only. auth.js toggles
           it based on hostname. Submitting from root redirects to the
           org's subdomain login. -->
      <label class="login-field" data-org-field hidden>
        <span>Organization</span>
        <input
          type="text"
          name="organization"
          autocomplete="organization"
          autocapitalize="off"
          spellcheck="false"
          data-org
        />
      </label>

      <!-- Password field — visible only in password mode (org subdomain). -->
      <label class="login-field" data-password-field>
        <span>Password</span>
        <span class="login-password-wrap">
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            data-password
          />
          <button
            type="button"
            class="login-password-toggle"
            data-password-toggle
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10.6 6.1A11.7 11.7 0 0 1 12 6c6.5 0 10 6 10 6a16.5 16.5 0 0 1-3.2 3.7M6.6 6.6A16.7 16.7 0 0 0 2 12s3.5 6 10 6c1.6 0 3-.3 4.3-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      </label>

      <button class="btn primary login-submit" type="submit" data-submit>
        <span class="login-submit-label" data-submit-label>Sign in</span>
      </button>

      <button class="login-forgot" type="button" data-forgot-start hidden>Forgot password?</button>

      <p class="login-error" id="login-error" role="alert"></p>
    </form>

    <form class="login-form" data-reset-form hidden novalidate>
      <label class="login-field">
        <span>Employee code or email</span>
        <input
          type="text"
          name="identifier"
          placeholder="EMP001 or you@company.com"
          required
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
        />
      </label>
      <button class="btn primary login-submit" type="button" data-reset-send>
        <span data-reset-send-label>Send OTP</span>
      </button>
      <div class="login-reset-step" data-reset-otp-step>
        <label class="login-field">
          <span>OTP</span>
          <input type="text" name="otp" placeholder="6-digit OTP" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        </label>
        <button class="btn primary login-submit" type="button" data-reset-verify>
          <span data-reset-verify-label>Verify OTP</span>
        </button>
      </div>
      <div class="login-reset-step" data-reset-password-step hidden>
        <label class="login-field">
          <span>New password</span>
          <input type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" />
        </label>
        <label class="login-field">
          <span>Confirm new password</span>
          <input type="password" name="confirm_password" placeholder="Re-enter new password" autocomplete="new-password" minlength="8" />
        </label>
        <button class="btn primary login-submit" type="submit">
          <span>Set new password</span>
        </button>
      </div>
      <button class="login-forgot" type="button" data-reset-cancel>Back to sign in</button>
      <p class="login-error" data-reset-message role="alert"></p>
    </form>

    <!-- HRMS-only mode: org has access_mode=hrms_link. No password, no magic
         link — the only entry is a signed launch from the HRMS. -->
    <div class="login-hrms" data-login-hrms hidden>
      <h2>Open from your HRMS</h2>
      <p>This organization signs in through your HRMS. Go to the Policies tile inside the HRMS to enter the portal.</p>
    </div>

    <!-- Confirmation state — replaces the form after a successful magic-link
         request on the subdomain. Hidden on root. -->
    <div class="login-sent" data-login-sent hidden>
      <h2>Check your email</h2>
      <p>We sent a sign-in link to <strong data-sent-to></strong>. Open it on this device to finish signing in.</p>
      <p class="login-sent-hint">Don't see it? <button type="button" class="link" data-resend>Send a new link</button>.</p>
      <p class="login-dev-link" data-dev-link hidden>
        <strong>Dev shortcut:</strong> <a data-dev-link-anchor href="#">open the link</a>
      </p>
    </div>

  </div>
</section>
