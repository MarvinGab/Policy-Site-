<section class="login" id="login">
  <div class="login-card reveal">
    <div>
      <p class="eyebrow">SECURE ACCESS</p>
      <h2>Employees log in with confidence.</h2>
      <p class="lead">
        Secure sign-in, audit-ready logs, and clear access boundaries keep
        your policy portal protected.
      </p>
    </div>
    <form class="login-form" id="login-form">
      <div class="login-seal" aria-hidden="true"></div>
      <label>
        <span>Email</span>
        <input type="email" name="email" placeholder="you@company.com" required autocomplete="email" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" placeholder="Enter password" required autocomplete="current-password" />
      </label>
      <button class="btn primary" type="submit">Login</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>
</section>
